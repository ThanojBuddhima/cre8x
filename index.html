<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#070B10" />
    <meta
      name="description"
      content="SYNQ is Colombo’s mobility operating system for 2100. Say where you need to be. The city moves you."
    />
    <title>SYNQ — Mobility OS</title>
    <script>
      // Apply the saved theme before first paint so there is no flash.
      try {
        var saved = localStorage.getItem('synq-theme')
        var dark =
          saved === 'dark' ||
          (saved !== 'light' &&
            !window.matchMedia('(prefers-color-scheme: light)').matches)
        document.documentElement.classList.toggle('dark', dark)
        document
          .querySelector('meta[name="theme-color"]')
          .setAttribute('content', dark ? '#070b10' : '#f4f6f8')
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx?v=mode1"></script>
  </body>
</html>
